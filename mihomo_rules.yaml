# Title: Anti-Fraud Block — Mihomo / Clash 远程规则集
# Description: 反诈 / 安全中心域名拒绝规则，由 hosts.txt 转换而来
# Format: Mihomo rule-provider, behavior: classical
# Source: https://github.com/codecodegogogo/Anti-Block
#
# 用法（Mihomo / Clash.Meta 主配置）：
#   rule-providers:
#     anti-fraud:
#       type: http
#       behavior: classical
#       url: "https://cdn.jsdelivr.net/gh/codecodegogogo/Anti-Block@main/mihomo_rules.yaml"
#       path: ./ruleset/anti_fraud.yaml
#       interval: 86400
#
#   rules:
#     - RULE-SET,anti-fraud,REJECT
#
# 说明：
#   - DOMAIN-SUFFIX 匹配域名本身及其所有子域名，与 hosts.txt 中
#     0.0.0.0 域名的拦截范围一致。
#   - 规则只拦截新发起的连接；App 用 HTTPDNS 拿 IP 直连时，需要开启
#     sniffer（流量嗅探）并按 SNI 匹配才能拦住。
#   - 本文件是 classical 格式，不要用 behavior: domain 加载。

